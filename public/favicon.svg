<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="favPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- rounded squircle background -->
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#favBadgeGrad)" filter="url(#favGlow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="16.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" fill="none"/>

  <!-- white inner clinical cross -->
  <g fill="#ffffff">
    <rect x="27" y="14" width="10" height="36" rx="5" opacity="0.95"/>
    <rect x="14" y="27" width="36" height="10" rx="5" opacity="0.95"/>
  </g>

  <!-- ecg heartbeat pulse line -->
  <path d="M12 32h11l3.5-8 6 16 5-11 3 5h11.5" 
        stroke="url(#favPulseGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>

  <!-- refined tracker radar beacon -->
  <circle cx="49" cy="15" r="2.2" fill="#38bdf8"/>
  <circle cx="49" cy="15" r="4.8" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.85"/>
  <circle cx="49" cy="15" r="7.8" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="1.5 1.5" fill="none" opacity="0.4"/>
</svg>
