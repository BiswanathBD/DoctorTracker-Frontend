<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded squircle background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- white inner medical cross & pulse tracker -->
  <g fill="#ffffff">
    <!-- vertical cross bar -->
    <rect x="27" y="16" width="10" height="32" rx="5" opacity="0.95"/>
    <!-- horizontal cross bar -->
    <rect x="16" y="27" width="32" height="10" rx="5" opacity="0.95"/>
  </g>

  <!-- ecg heartbeat pulse line -->
  <path d="M14 32h10l3-7 6 15 4-10 3 4h10" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>

  <!-- tracker ping dot -->
  <circle cx="48" cy="18" r="4" fill="#38bdf8"/>
  <circle cx="48" cy="18" r="6" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8"/>
</svg>
