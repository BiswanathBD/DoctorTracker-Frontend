<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <!-- background dual medical gradient -->
    <linearGradient id="logoBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- ecg pulse trace gradient -->
    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- soft drop shadow -->
    <filter id="softEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- emblem squircle badge -->
  <g filter="url(#softEmblemShadow)">
    <rect x="8" y="8" width="64" height="64" rx="19" fill="url(#logoBadgeGrad)" />
    <rect x="8.75" y="8.75" width="62.5" height="62.5" rx="18.25" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" fill="none" />
  </g>

  <!-- clinical cross mark -->
  <g fill="#ffffff">
    <rect x="35" y="20" width="10" height="40" rx="5" opacity="0.95" />
    <rect x="20" y="35" width="40" height="10" rx="5" opacity="0.95" />
  </g>

  <!-- precision heartbeat ecg tracker line -->
  <path
    d="M17 40h11l3.5-9 6 18 5-12 3 5.5h12.5"
    stroke="url(#pulseLineGrad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- refined compact telemetry radar tracking beacon -->
  <circle cx="59" cy="21" r="2.2" fill="#38bdf8" />
  <circle cx="59" cy="21" r="4.6" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.85" />
  <circle cx="59" cy="21" r="7.4" stroke="#ffffff" stroke-width="0.65" stroke-dasharray="1.5 1.5" fill="none" opacity="0.4" />
</svg>
